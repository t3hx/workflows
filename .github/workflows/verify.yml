name: verify

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      e2e:
        description: Lancer pnpm test:e2e (Playwright, Chromium)
        type: boolean
        default: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Script absent = étape sautée. typecheck ET type-check :
      # solarsys/owlog utilisent l'un, myPortfolio l'autre.
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present format:check
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present type-check
      - run: pnpm run --if-present test
      - run: pnpm run --if-present build

  e2e:
    if: inputs.e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
