name: deploy

on:
  workflow_call:
    inputs:
      image:
        description: Image GHCR sans tag (ex. ghcr.io/t3hx/solarsys-react-app)
        type: string
        required: true
      prod-url:
        description: URL publique de la prod (ex. https://solarsys.nspace.link)
        type: string
        required: true
      origin-ip:
        description: IP Tailscale du VPS, pour vérifier sans passer par Cloudflare
        type: string
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: dry
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true
      - id: pick
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.dry.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=main-
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ needs.version.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Dokploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_PROD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_PROD_WEBHOOK_URL is not set."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK_URL"
      - name: Wait until production serves the new version
        env:
          BASE_URL: ${{ inputs.prod-url }}
          ORIGIN_IP: ${{ inputs.origin-ip }}
          EXPECTED: ${{ needs.version.outputs.tag }}
        run: |
          host="${BASE_URL#https://}"
          for i in $(seq 1 30); do
            live=$(curl -fsS --max-time 10 --resolve "$host:80:$ORIGIN_IP" \
              "http://$host/version.json" | jq -r '.version' 2>/dev/null || echo "")
            if [ "$live" = "$EXPECTED" ]; then
              echo "Production serves $EXPECTED."
              exit 0
            fi
            echo "Attempt $i/30: live='$live', expected='$EXPECTED'. Retrying in 10 s..."
            sleep 10
          done
          echo "::error::Production never served $EXPECTED."
          exit 1

  release:
    needs: [version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
